<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizador</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--panel:#fff;--side:#121a2b;--side-ink:#c3cde0;--ink:#151d2c;--muted:#66758a;--line:#dde3ec;--accent:#3d5afe;--on-accent:#fff;--hl:#7aa2ff;--danger:#c0392b;
--school:#00c46a;--games:#ff3b5c;--work:#ffab00;--mobile:#a24bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121c;--panel:#161e2e;--side:#0a0f18;--ink:#e6ebf4;--muted:#8d9bb0;--line:#26324a;--accent:#7aa2ff;--on-accent:#0b1220;--danger:#ff8a80;--school:#2fe58f;--games:#ff5f7c;--work:#ffc233;--mobile:#b880ff}}
:root[data-theme="dark"]{--bg:#0d121c;--panel:#161e2e;--side:#0a0f18;--ink:#e6ebf4;--muted:#8d9bb0;--line:#26324a;--accent:#7aa2ff;--on-accent:#0b1220;--danger:#ff8a80;--school:#2fe58f;--games:#ff5f7c;--work:#ffc233;--mobile:#b880ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:color-mix(in srgb,var(--accent) 5%,var(--bg));color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:26px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:#fff;padding:0 10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.nav-label{padding:0 10px;font-size:.82rem;color:#7d8aa3;margin-bottom:-14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="true"]{background:rgba(255,255,255,.12);color:#fff}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--hl)}
.ic{width:18px;height:18px;flex:none}
.nav .ic{color:var(--c)}
.nav .n{margin-left:auto;font-size:.82rem;background:rgba(255,255,255,.1);padding:0 8px;border-radius:99px}
.prog{margin-top:auto;padding:0 10px}
.prog p{margin:0 0 8px;font-size:.85rem}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hl);transition:width .3s}
.main{padding:34px clamp(18px,4vw,48px) 60px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h1{margin:0;font-size:1.8rem;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--muted)}
.themebtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;color:var(--muted);white-space:nowrap}
.add{display:grid;grid-template-columns:1fr 200px auto;gap:8px;margin:22px 0 8px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.add input,.add select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:8px;padding:10px 20px}
.btn:hover{filter:brightness(1.1)}
.hint{min-height:1.4em;margin:0 0 14px 2px;font-size:.88rem;color:var(--muted)}
.hint.err{color:var(--danger)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.sec{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:6px 16px 10px;min-width:0}
.sec-head{display:flex;align-items:center;gap:8px;padding:12px 0 8px;font-weight:600}
.sec-head .ic{color:var(--c)}
.sec-head .k{margin-left:auto;font-weight:400;color:var(--muted);font-size:.85rem}
.list{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.chk{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;background:none;display:grid;place-items:center;padding:0;color:var(--on-accent)}
.task.done .chk{background:var(--c);border-color:var(--c)}
.chk svg{width:12px;height:12px;opacity:0}.task.done .chk svg{opacity:1}
.txt{overflow-wrap:anywhere}
.task.done .txt{color:var(--muted);text-decoration:line-through}
.mv{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px;font-size:.78rem;max-width:84px;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:1.1rem;line-height:1}
.del:hover{color:var(--danger);background:var(--bg)}
.empty{padding:12px 0 6px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.clear{margin-top:16px;background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 26px rgba(0,0,0,.28)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
.main{margin:0 auto;max-width:1240px}
.head{position:relative;justify-content:center;text-align:center;padding:0 100px}
.head h1{font-size:2.3rem}
.tmenu{position:absolute;right:0;top:0;z-index:15}
.add{max-width:780px;margin:26px auto 8px}
.add input,.add select{padding:13px 14px;font-size:1rem}
.btn{padding:13px 24px}
.hint{text-align:center}
.board{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:22px;margin-top:8px}
.sec{background:color-mix(in srgb,var(--c) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-top:6px solid var(--c);border-radius:16px;padding:10px 24px 18px;min-height:280px;box-shadow:0 6px 20px color-mix(in srgb,var(--c) 14%,transparent)}
.sec-head{font-size:1.25rem;padding:16px 0 12px}
.sec-head .ic{width:26px;height:26px}
.sec-head .k{background:var(--c);color:#0b1220;padding:2px 12px;border-radius:99px;font-size:.85rem;font-weight:600}
.task{padding:13px 0;font-size:1.02rem;border-top:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}
.chk{width:24px;height:24px;border-color:var(--c)}
.empty{font-size:1rem;border-top-color:color-mix(in srgb,var(--c) 25%,var(--line))}
.clear{display:block;margin:22px auto 0}
@media(max-width:800px){
.app{grid-template-columns:1fr}
.side{position:static;height:auto;padding:14px 16px}
.nav-label,.prog{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-around;gap:0;background:var(--side);border-top:1px solid rgba(255,255,255,.1);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;justify-content:center}
.nav button[aria-current="true"]{background:none}
.nav button[aria-current="true"]::before{display:none}
.nav .n{position:absolute;top:0;right:12%;font-size:.65rem;padding:0 6px;margin:0}
.main{padding-bottom:100px}
.add{grid-template-columns:1fr}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.themebtn{display:flex;align-items:center;gap:8px;font-weight:500}
.cdot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:264px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);text-align:left}
.pop[hidden]{display:none}
.pop p{margin:0 0 8px;font-size:.85rem;color:var(--muted);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sw button{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:var(--k);box-shadow:inset 0 0 0 2px var(--panel);padding:0;display:grid;place-items:center}
.sw button[aria-pressed="true"]{border-color:var(--k)}
.sw svg{width:14px;height:14px;opacity:0;color:#fff}
.sw button[aria-pressed="true"] svg{opacity:1}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{flex:1;border:0;background:none;padding:7px 4px;color:var(--muted);font-size:.85rem}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
@media(max-width:800px){.head{flex-direction:column;align-items:center;padding:0}.tmenu{position:relative;margin-top:10px}.pop{right:auto;left:50%;transform:translateX(-50%)}.sec{padding:8px 18px 14px;min-height:0}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Organizador</div>
  <div class="nav-label">Categorías</div>
  <nav class="nav" id="nav" aria-label="Categorías"></nav>
  <div class="prog"><p id="progTxt"></p><div class="bar"><i id="progBar"></i></div></div>
</aside>
<main class="main">
  <div class="head">
    <div><h1 id="title">Todas</h1><p id="sub"></p></div>
    <div class="tmenu"><button class="themebtn" id="theme" type="button" aria-haspopup="true" aria-expanded="false"><span class="cdot"></span>Colores</button>
      <div class="pop" id="pop" hidden><p>Color de la página</p><div class="sw" id="sw"></div><p>Modo</p><div class="modes" id="modes"></div></div></div>
  </div>
  <form class="add" id="form" autocomplete="off">
    <label class="sr" for="t">Agregar algo</label>
    <input type="text" id="t" maxlength="140" placeholder="Escribe algo, por ejemplo: estudiar matemáticas mañana">
    <label class="sr" for="c">Categoría</label>
    <select id="c"></select>
    <button class="btn" type="submit">Organizar</button>
  </form>
  <p class="hint" id="hint" role="status"></p>
  <section class="board" id="board"></section>
  <button class="clear" id="clear" type="button">Borrar completadas</button>
</main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
var CATS=[{id:"school",n:"Escuela",e:"Sin tareas de escuela."},{id:"games",n:"Juegos",e:"Nada pendiente en juegos."},{id:"work",n:"Otros oficios",e:"Sin oficios pendientes."},{id:"mobile",n:"Móvil",e:"Nada pendiente del celular."}];
var KW={school:"tarea tareas examen examenes estudiar escuela colegio matematicas ingles clase clases profesor profesora deber deberes historia ciencia ciencias lengua leccion exposicion proyecto leer libro".split(" "),
games:"fortnite roblox minecraft valorant juego juegos gaming steam jugar partida torneo nivel consola xbox playstation".split(" "),
work:"pc computadora computador windows gpu cpu ram monitor teclado mouse driver drivers programar programacion codigo laptop disco ssd linux trabajo reunion cliente factura limpiar cocinar comprar arreglar reparar oficio cita banco pagar mercado".split(" "),
mobile:"celular movil telefono android iphone whatsapp app apps aplicacion bateria tiktok instagram cargador".split(" ")};
var IC={all:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',school:'<path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 1 2-2h13"/>',games:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4M16 11.5h.01M18.5 14h.01"/>',work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',mobile:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>'};
var KEYS=["organizador.v4"],COLOR="organizador.color",THEME="organizador.tema";
var S={items:[],view:"all"},$=function(i){return document.getElementById(i)},hintT,toastT;

function icon(id){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[id]+'</svg>'}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function catName(id){return (CATS.filter(function(c){return c.id===id})[0]||CATS[2]).n}
function detect(t){var n=" "+norm(t).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ",best="work",top=0;
 Object.keys(KW).forEach(function(k){var p=0;KW[k].forEach(function(w){if(n.indexOf(" "+w+" ")>-1)p++});if(p>top){top=p;best=k}});return best}

function load(){
 ["organizador.v3","organizador.v2","organizador.items.v1"].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
 for(var k=0;k<KEYS.length;k++){
  try{var d=JSON.parse(localStorage.getItem(KEYS[k])||"[]");
   if(Array.isArray(d)&&d.length){
    S.items=d.map(function(i,n){var c=i.c||i.cat||"work";if(c==="pc"||c==="other")c="work";
     return {id:i.id||Date.now()+n,t:String(i.t||i.texto||""),c:c,done:!!(i.done!==undefined?i.done:i.hecho)}}).filter(function(i){return i.t});
    return}}catch(e){}}}
function save(){try{localStorage.setItem(KEYS[0],JSON.stringify(S.items))}catch(e){}}
function hint(m,err){var h=$("hint");h.textContent=m;h.className="hint"+(err?" err":"");clearTimeout(hintT);if(m)hintT=setTimeout(function(){h.textContent=""},3500)}
function toast(msg,undo){var t=$("toast");t.textContent="";t.appendChild(el("span","",msg));
 if(undo){var b=el("button","","Deshacer");b.type="button";b.onclick=function(){undo();t.hidden=true;save();render()};t.appendChild(b)}
 t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},5000)}

function task(i){
 var li=el("li","task"+(i.done?" done":""));
 var ck=el("button","chk");ck.type="button";ck.setAttribute("role","checkbox");ck.setAttribute("aria-checked",String(i.done));ck.setAttribute("aria-label","Completar: "+i.t);
 ck.innerHTML='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>';
 ck.onclick=function(){i.done=!i.done;save();render()};
 var mv=el("select","mv");mv.setAttribute("aria-label","Mover a otra categoría: "+i.t);
 CATS.forEach(function(c){var o=el("option","",c.n);o.value=c.id;if(c.id===i.c)o.selected=true;mv.appendChild(o)});
 mv.onchange=function(){i.c=mv.value;save();render();toast("Movida a "+catName(i.c)+".")};
 var del=el("button","del","×");del.type="button";del.setAttribute("aria-label","Eliminar: "+i.t);
 del.onclick=function(){var prev=S.items.slice();S.items=S.items.filter(function(x){return x!==i});save();render();toast("Eliminada.",function(){S.items=prev})};
 li.appendChild(ck);li.appendChild(el("span","txt",i.t));li.appendChild(mv);li.appendChild(del);return li}

function section(c){
 var all=S.items.filter(function(i){return i.c===c.id}),pend=all.filter(function(i){return !i.done}).length;
 var s=el("section","sec");s.style.setProperty("--c","var(--"+c.id+")");
 var h=el("div","sec-head");h.innerHTML=icon(c.id);h.appendChild(el("span","",c.n));
 h.appendChild(el("span","k",pend+(pend===1?" pendiente":" pendientes")));s.appendChild(h);
 var ul=el("ul","list");
 if(!all.length)ul.appendChild(el("li","empty",c.e));
 all.slice().reverse().forEach(function(i){var li=task(i);li.style.setProperty("--c","var(--"+c.id+")");ul.appendChild(li)});
 s.appendChild(ul);return s}

function render(){
 var nav=$("nav");nav.textContent="";
 [{id:"all",n:"Todas"}].concat(CATS).forEach(function(c){
  var cnt=S.items.filter(function(i){return !i.done&&(c.id==="all"||i.c===c.id)}).length;
  var b=el("button","");b.type="button";b.setAttribute("aria-current",String(S.view===c.id));
  b.style.setProperty("--c",c.id==="all"?"#9fb0cc":"var(--"+c.id+")");
  b.innerHTML=icon(c.id);b.appendChild(el("span","",c.n));b.appendChild(el("span","n",String(cnt)));
  b.onclick=function(){S.view=c.id;render()};nav.appendChild(b)});
 var tot=S.items.length,dn=S.items.filter(function(i){return i.done}).length,pend=tot-dn;
 $("title").textContent=S.view==="all"?"Todas":catName(S.view);
 $("sub").textContent=pend+(pend===1?" pendiente":" pendientes")+" de "+tot;
 $("progTxt").textContent=tot?dn+" de "+tot+" completadas":"Sin tareas todavía";
 $("progBar").style.width=(tot?Math.round(dn/tot*100):0)+"%";
 var b=$("board");b.textContent="";
 CATS.forEach(function(c){if(S.view==="all"||S.view===c.id)b.appendChild(section(c))});
 $("clear").hidden=!dn}

var au=el("option","","Detectar automáticamente");au.value="auto";$("c").appendChild(au);
CATS.forEach(function(c){var o=el("option","",c.n);o.value=c.id;$("c").appendChild(o)});

$("form").onsubmit=function(e){e.preventDefault();var t=$("t").value.trim();
 if(!t){hint("Escribe algo antes de organizar.",true);$("t").focus();return}
 var c=$("c").value==="auto"?detect(t):$("c").value;
 S.items.push({id:Date.now(),t:t,c:c,done:false});save();$("t").value="";render();hint("Organizada en "+catName(c)+".");$("t").focus()};
$("clear").onclick=function(){var prev=S.items.slice(),n=S.items.filter(function(i){return i.done}).length;S.items=S.items.filter(function(i){return !i.done});save();render();toast(n+(n===1?" borrada.":" borradas."),function(){S.items=prev})};
var COLORS=[{n:"Azul",a:"#3d5afe",s:"#121a2b",h:"#7aa2ff"},{n:"Verde",a:"#0f9d58",s:"#0d2a1c",h:"#5fe0a0"},{n:"Rojo",a:"#e0283e",s:"#2b0f16",h:"#ff8a98"},{n:"Morado",a:"#8b3dff",s:"#1e1233",h:"#c39bff"},{n:"Naranja",a:"#d95a00",s:"#2a1809",h:"#ffb066"},{n:"Rosa",a:"#e0338f",s:"#2b1020",h:"#ff9ccc"},{n:"Turquesa",a:"#0a8f9c",s:"#0b2429",h:"#5fdbe6"},{n:"Gris",a:"#4a5a78",s:"#1a2130",h:"#a9b8d4"}];
function markColor(i){Array.prototype.forEach.call($("sw").children,function(b,k){b.setAttribute("aria-pressed",String(k===i))})}
function applyColor(i){var c=COLORS[i],r=document.documentElement.style;r.setProperty("--accent",c.a);r.setProperty("--on-accent","#fff");r.setProperty("--side",c.s);r.setProperty("--hl",c.h);markColor(i);try{localStorage.setItem(COLOR,String(i))}catch(e){}}
function applyMode(m){var r=document.documentElement;if(m==="auto")delete r.dataset.theme;else r.dataset.theme=m;Array.prototype.forEach.call($("modes").children,function(b){b.setAttribute("aria-pressed",String(b.dataset.m===m))});try{localStorage.setItem(THEME,m)}catch(e){}}
function pop(open){$("pop").hidden=!open;$("theme").setAttribute("aria-expanded",String(open))}
COLORS.forEach(function(c,i){var b=el("button","");b.type="button";b.title=c.n;b.setAttribute("aria-label","Color "+c.n);b.style.setProperty("--k",c.a);
 b.innerHTML='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>';
 b.onclick=function(){applyColor(i)};$("sw").appendChild(b)});
[["auto","Auto"],["light","Claro"],["dark","Oscuro"]].forEach(function(m){var b=el("button","",m[1]);b.type="button";b.dataset.m=m[0];b.onclick=function(){applyMode(m[0])};$("modes").appendChild(b)});
$("theme").onclick=function(e){e.stopPropagation();pop($("pop").hidden)};
document.addEventListener("click",function(e){if(!$("pop").hidden&&!$("pop").contains(e.target))pop(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")pop(false)});
var sm="auto",sc=0;try{sm=localStorage.getItem(THEME)||"auto";var raw=localStorage.getItem(COLOR);if(raw!==null)sc=parseInt(raw,10)}catch(e){}
applyMode(sm==="light"||sm==="dark"?sm:"auto");if(sc>0&&sc<COLORS.length)applyColor(sc);else markColor(0);
load();render();
})();
</script>
</body>
</html>
